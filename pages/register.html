<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زروان | ثبت‌نام / ورود</title>
    <link rel="stylesheet" href="../src/output.css">
    <link rel="shortcut icon" href="../images/logo.svg" type="image/x-icon">
</head>
<body class="login flex items-center justify-center min-h-screen font-vazir">
    <!-- SVG List -->
    <svg class="hidden">
        <symbol id="opened-eye" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000000" viewBox="0 0 256 256"><path d="M251,123.13c-.37-.81-9.13-20.26-28.48-39.61C196.63,57.67,164,44,128,44S59.37,57.67,33.51,83.52C14.16,102.87,5.4,122.32,5,123.13a12.08,12.08,0,0,0,0,9.75c.37.82,9.13,20.26,28.49,39.61C59.37,198.34,92,212,128,212s68.63-13.66,94.48-39.51c19.36-19.35,28.12-38.79,28.49-39.61A12.08,12.08,0,0,0,251,123.13Zm-46.06,33C183.47,177.27,157.59,188,128,188s-55.47-10.73-76.91-31.88A130.36,130.36,0,0,1,29.52,128,130.45,130.45,0,0,1,51.09,99.89C72.54,78.73,98.41,68,128,68s55.46,10.73,76.91,31.89A130.36,130.36,0,0,1,226.48,128,130.45,130.45,0,0,1,204.91,156.12ZM128,84a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,84Zm0,64a20,20,0,1,1,20-20A20,20,0,0,1,128,148Z"></path></symbol>
        <symbol id="closed-eye" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000000" viewBox="0 0 256 256"><path d="M234.42,162A12,12,0,1,1,213.58,174l-16.86-29.5a127.19,127.19,0,0,1-30.17,13.86L171.84,190a12,12,0,0,1-9.87,13.8,11.22,11.22,0,0,1-2,.17,12,12,0,0,1-11.82-10L143,163.17a136.5,136.5,0,0,1-30.06,0L107.84,194A12,12,0,0,1,96,204a11.22,11.22,0,0,1-2-.17A12,12,0,0,1,84.16,190l5.29-31.72a127.19,127.19,0,0,1-30.17-13.86L42.42,174A12,12,0,1,1,21.58,162L40,129.85a159.73,159.73,0,0,1-17.31-18.31A12,12,0,0,1,41.34,96.46C57.38,116.32,85.44,140,128,140s70.62-23.68,86.66-43.54a12,12,0,0,1,18.67,15.08A159.73,159.73,0,0,1,216,129.85Z"></path></symbol>
    </svg>

    <div class="w-90 bg-white min-h-80 p-5 rounded-4xl">
        <form class="flex flex-col" action="#">
            <h1 class="text-center text-3xl font-peyda-black mb-4">ورود / ثبت نام</h1>
            <label for="#email">ایمیل</label>
            <input class="w-full h-12 mt-2 bg-black text-white p-4 rounded-2xl" type="email" id="email" placeholder="ایمیل خود را وارد کنید">
            <label class="mt-4" for="#password">گذرواژه</label>
            <input class="w-full h-12 mt-2 bg-black text-white p-4 rounded-2xl" type="password" id="password" placeholder="گذرواژه خود را وارد کنید">
            <button id="toggle-password" type="button">
                <svg class="h-6 w-6 mt-2 cursor-pointer" id="eyeClose"> 
                    <use href="#closed-eye"></use>
                </svg>
                <svg class="h-6 w-6 mt-2 hidden cursor-pointer" id="eyeOpen"> 
                    <use href="#opened-eye"></use>
                </svg>
            </button>
            <div class="flex justify-center items-center gap-2 mt-8 w-full h-12 border hover:bg-black hover:text-white rounded-2xl cursor-pointer">
                <img class="h-6 w-6" src="../images/Google_Favicon_2025.svg" alt="Google_Favicon_2025">
                ورود با گوگل
            </div>
            <input class="flex justify-center items-center w-full h-12 border hover:bg-black hover:text-white mt-4 rounded-2xl cursor-pointer" type="submit" value="ورود">
        </form>
    </div>

    <script src="../scripts/script.js"></script>
</body>
</html>
